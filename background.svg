<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4a7db5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#16325e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6ba3d6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#16325e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#2a5f8f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16325e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ab7e6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7ab7e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7db5" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#7ab7e6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a7db5" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="600"/>
    </clipPath>
  </defs>

  <rect width="1200" height="600" fill="#16325e"/>

  <rect width="1200" height="600" fill="url(#glow1)"/>
  <rect width="1200" height="600" fill="url(#glow2)"/>
  <rect width="1200" height="600" fill="url(#glow3)"/>

  <!-- Animated floating orbs -->
  <circle cx="200" cy="150" r="60" fill="#4a7db5" opacity="0.15" filter="url(#blur2)">
    <animate attributeName="cy" values="150;180;150" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="200;220;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="60;70;60" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="950" cy="400" r="80" fill="#6ba3d6" opacity="0.12" filter="url(#blur2)">
    <animate attributeName="cy" values="400;370;400" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="950;920;950" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="80;65;80" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="500" r="50" fill="#2a5f8f" opacity="0.2" filter="url(#blur2)">
    <animate attributeName="cy" values="500;470;500" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="600;630;600" dur="7s" repeatCount="indefinite"/>
  </circle>

  <circle cx="100" cy="450" r="40" fill="#7ab7e6" opacity="0.1" filter="url(#blur2)">
    <animate attributeName="cy" values="450;420;450" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="100;130;100" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="100" r="45" fill="#4a7db5" opacity="0.12" filter="url(#blur2)">
    <animate attributeName="cy" values="100;130;100" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1050;1020;1050" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated grid lines -->
  <g opacity="0.08" stroke="#7ab7e6" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100">
      <animate attributeName="opacity" values="0.08;0.15;0.08" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="200" x2="1200" y2="200">
      <animate attributeName="opacity" values="0.08;0.12;0.08" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="300" x2="1200" y2="300">
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="400" x2="1200" y2="400">
      <animate attributeName="opacity" values="0.08;0.13;0.08" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="500" x2="1200" y2="500">
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="4.5s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="0" x2="200" y2="600">
      <animate attributeName="opacity" values="0.08;0.14;0.08" dur="5.5s" repeatCount="indefinite"/>
    </line>
    <line x1="400" y1="0" x2="400" y2="600">
      <animate attributeName="opacity" values="0.08;0.17;0.08" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="0" x2="600" y2="600">
      <animate attributeName="opacity" values="0.08;0.11;0.08" dur="6.5s" repeatCount="indefinite"/>
    </line>
    <line x1="800" y1="0" x2="800" y2="600">
      <animate attributeName="opacity" values="0.08;0.19;0.08" dur="3.8s" repeatCount="indefinite"/>
    </line>
    <line x1="1000" y1="0" x2="1000" y2="600">
      <animate attributeName="opacity" values="0.08;0.13;0.08" dur="5.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Diagonal accent lines -->
  <g opacity="0.06" stroke="#7ab7e6" stroke-width="1.5">
    <line x1="0" y1="0" x2="300" y2="600">
      <animate attributeName="opacity" values="0.06;0.15;0.06" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="900" y1="0" x2="1200" y2="300">
      <animate attributeName="opacity" values="0.06;0.12;0.06" dur="8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="300" x2="500" y2="600">
      <animate attributeName="opacity" values="0.06;0.14;0.06" dur="6s" repeatCount="indefinite"/>
    </line>
    <line x1="700" y1="0" x2="1200" y2="500">
      <animate attributeName="opacity" values="0.06;0.11;0.06" dur="9s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Animated particles -->
  <g filter="url(#blur3)">
    <circle cx="150" cy="80" r="2.5" fill="#7ab7e6" opacity="0.7">
      <animate attributeName="cy" values="80;50;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="200" r="2" fill="#7ab7e6" opacity="0.5">
      <animate attributeName="cy" values="200;170;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="120" r="3" fill="#7ab7e6" opacity="0.6">
      <animate attributeName="cy" values="120;90;120" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1100" cy="250" r="2" fill="#7ab7e6" opacity="0.5">
      <animate attributeName="cy" values="250;220;250" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="350" r="2.5" fill="#7ab7e6" opacity="0.6">
      <animate attributeName="cy" values="350;320;350" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="480" r="2" fill="#7ab7e6" opacity="0.5">
      <animate attributeName="cy" values="480;450;480" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="520" r="3" fill="#7ab7e6" opacity="0.6">
      <animate attributeName="cy" values="520;490;520" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="550" r="2" fill="#7ab7e6" opacity="0.5">
      <animate attributeName="cy" values="550;520;550" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="300" r="2" fill="#7ab7e6" opacity="0.4">
      <animate attributeName="cy" values="300;270;300" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="400" r="2.5" fill="#7ab7e6" opacity="0.5">
      <animate attributeName="cy" values="400;370;400" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="50" r="1.5" fill="#7ab7e6" opacity="0.4">
      <animate attributeName="cy" values="50;30;50" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="580" r="2" fill="#7ab7e6" opacity="0.5">
      <animate attributeName="cy" values="580;550;580" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pulsing center glow -->
  <circle cx="600" cy="300" r="200" fill="#4a7db5" opacity="0.04" filter="url(#blur2)">
    <animate attributeName="r" values="200;220;200" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.04;0.07;0.04" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated border accent -->
  <rect x="20" y="20" width="1160" height="560" rx="12" fill="none" stroke="#4a7db5" stroke-width="1" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.35;0.2" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="1;1.5;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Top highlight bar -->
  <rect x="20" y="20" width="120" height="3" rx="1.5" fill="#7ab7e6" opacity="0.3">
    <animate attributeName="width" values="120;180;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="20;40;20" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent line -->
  <rect x="1000" y="577" width="180" height="3" rx="1.5" fill="#4a7db5" opacity="0.3">
    <animate attributeName="width" values="180;120;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="1000;980;1000" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>